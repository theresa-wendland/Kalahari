name: Site tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, nav-updates]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-tests:
    name: Image and navigation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
